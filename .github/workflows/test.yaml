name: Test

on:
  push:

env:
  OPA_VERSION: 1.12.3

jobs:
  test:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:

      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          java-package: jdk
          distribution: temurin
          cache: maven

      - name: Run tests
        run: mvn clean test
  opa-test:
    name: Run OPA tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup OPA
        uses: open-policy-agent/setup-opa@v2
        with:
          version: ${{ env.OPA_VERSION }}

      - name: Run OPA tests
        run: opa test src/main/resources/rego

  frontend-test:
    name: Run frontend lint, tests, and builds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Run tests
        working-directory: frontend
        run: npm run test:ci

      - name: Build SPA
        working-directory: frontend
        run: npm run build

      - name: Build Web Component
        working-directory: frontend
        run: npm run build:component
