name: Pre-Release

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled
env:
  REGISTRY: quay.io
  REPOSITORY: fiware

# one run at a time per pull request: opening one with a label fires two events at once, and both
# would publish the same pre-release
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:

  # The version from the semver label of the pull request, read when the job runs. See
  # https://github.com/FIWARE/github-workflows
  generate-version:
    uses: FIWARE/github-workflows/.github/workflows/semver-version.yml@v1
    permissions:
      contents: read
      pull-requests: write
    with:
      tag-prefix: ""

  # image build&push
  build-arm:
    needs: [ "generate-version" ]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v2

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          java-package: jdk
          cache: maven
          distribution: temurin

      - name: Log into quay.io
        run: docker login -u "${{ secrets.QUAY_USERNAME }}" -p "${{ secrets.QUAY_PASSWORD }}" ${{ env.REGISTRY }}

      - name: Build image
        run: |
          ./mvnw versions:set -DnewVersion=${{ needs.generate-version.outputs.version }}
          ./mvnw clean package \
            -Dquarkus.package.type=native \
            -Dquarkus.container-image.build=true \
            -Dquarkus.jib.platforms=linux/arm64 \
            -Dquarkus.container-image.tag=${{ needs.generate-version.outputs.version }}-arm64 \
            -Dquarkus.container-image.registry="${{ env.REGISTRY }}" \
            -Dquarkus.container-image.group="${{ env.REPOSITORY }}"

      - name: Ensure br_netfilter is enabled.
        run: |
          sudo modprobe br_netfilter

      - name: Test image
        run: |
          ./mvnw integration-test -Pk8s-it  -DskipTests -Dquarkus.container-image.tag=${{ needs.generate-version.outputs.version }}-arm64 -Dquarkus.container-image.registry="${{ env.REGISTRY }}" -Dquarkus.container-image.group="${{ env.REPOSITORY }}" -Dhelm.version=3.17.3

      - name: Dump cluster diagnostics on failure
        if: failure()
        run: |
          docker exec k3s-maven-plugin kubectl get pods -A -o wide || true
          docker exec k3s-maven-plugin kubectl get events -A --sort-by=.lastTimestamp || true
          docker exec k3s-maven-plugin kubectl describe deployment it-opa || true
          docker exec k3s-maven-plugin kubectl describe pods --selector=app.kubernetes.io/instance=it-opa || true
          docker exec k3s-maven-plugin kubectl logs deployment/it-opa --all-containers --tail=200 || true

      - name: Push
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/odrl-pap:${{ needs.generate-version.outputs.version }}-arm64

  build-amd:
    needs: [ "generate-version" ]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v2

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          java-package: jdk
          cache: maven
          distribution: temurin

      - name: Log into quay.io
        run: docker login -u "${{ secrets.QUAY_USERNAME }}" -p "${{ secrets.QUAY_PASSWORD }}" ${{ env.REGISTRY }}

      - name: Build image
        run: |
          ./mvnw versions:set -DnewVersion=${{ needs.generate-version.outputs.version }}
          ./mvnw clean package \
            -Dquarkus.package.type=native \
            -Dquarkus.container-image.build=true \
            -Dquarkus.jib.platforms=linux/amd64 \
            -Dquarkus.container-image.tag=${{ needs.generate-version.outputs.version }}-amd64 \
            -Dquarkus.container-image.registry="${{ env.REGISTRY }}" \
            -Dquarkus.container-image.group="${{ env.REPOSITORY }}"

      - name: Ensure br_netfilter is enabled.
        run: |
          sudo modprobe br_netfilter

      - name: Test image
        run: |
          ./mvnw integration-test -Pk8s-it  -DskipTests -Dquarkus.container-image.tag=${{ needs.generate-version.outputs.version }}-amd64 -Dquarkus.container-image.registry="${{ env.REGISTRY }}" -Dquarkus.container-image.group="${{ env.REPOSITORY }}" -Dhelm.version=3.17.3

      - name: Push
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/odrl-pap:${{ needs.generate-version.outputs.version }}-amd64


  multi-arch:
    needs: [ "generate-version","build-amd","build-arm" ]
    runs-on: ubuntu-latest

    steps:
      - name: Log into quay.io
        run: docker login -u "${{ secrets.QUAY_USERNAME }}" -p "${{ secrets.QUAY_PASSWORD }}" ${{ env.REGISTRY }}

      - name: Create and push manifest
        run: |
          docker manifest create ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/odrl-pap:${{ needs.generate-version.outputs.version }} \
            ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/odrl-pap:${{ needs.generate-version.outputs.version }}-amd64 \
            ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/odrl-pap:${{ needs.generate-version.outputs.version }}-arm64
          
          docker manifest push ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/odrl-pap:${{ needs.generate-version.outputs.version }}

  # NOTE: npm pre-release publishing lives in the dedicated `publish-npm.yaml`
  # workflow. It is the single entry-point registered as the npm Trusted
  # Publisher and publishes pre-releases via OIDC (no NPM_TOKEN) under the
  # "next" dist-tag on pull_request events.

  # ---------------------------------------------------------------------------
  # Frontend: build and push Docker pre-release image
  # ---------------------------------------------------------------------------
  build-frontend-image:
    needs: [ "generate-version" ]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: Log into quay.io
        run: docker login -u "${{ secrets.QUAY_USERNAME }}" -p "${{ secrets.QUAY_PASSWORD }}" ${{ env.REGISTRY }}

      - name: Build frontend image
        run: docker build -t ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/odrl-pap-frontend:${{ needs.generate-version.outputs.version }} frontend/

      - name: Push frontend image
        run: docker push ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/odrl-pap-frontend:${{ needs.generate-version.outputs.version }}

  # Publishes the pre-release, replacing the one of the previous push, see
  # https://github.com/FIWARE/github-workflows
  git-release:
    needs: [ "generate-version", "multi-arch", "build-frontend-image" ]
    uses: FIWARE/github-workflows/.github/workflows/github-release.yml@v1
    permissions:
      contents: write
    with:
      version: ${{ needs.generate-version.outputs.version }}
      prerelease: true
      files: |
        LICENSE
