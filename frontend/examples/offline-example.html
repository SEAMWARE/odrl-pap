<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ODRL Policy Editor — without the PAP backend</title>
  <!-- Run `npm run build:component` first, then serve the frontend folder, e.g.
       `npx serve .` and open /examples/offline-example.html -->
  <script type="module" src="../dist-component/odrl-policy-editor.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 960px; margin: 2rem auto; padding: 0 1rem; }
    textarea { width: 100%; height: 14rem; font-family: monospace; }
    .row { display: flex; gap: .5rem; margin: .75rem 0; }
  </style>
</head>
<body>
  <h1>Policy as a form control</h1>
  <p>No <code>api-base-url</code>: nothing is loaded, saved or validated against the PAP.</p>

  <textarea id="raw" placeholder="Paste an ODRL policy here"></textarea>
  <div class="row">
    <button id="toggle">Show visual editor</button>
    <button id="extra">Add a custom action mapping</button>
  </div>

  <odrl-policy-editor
    id="editor" hidden
    load="none" save="none" validate="none" templates="none" mappings="none"
    hide-template-create-tab
  ></odrl-policy-editor>

  <script type="module">
    const raw = document.getElementById('raw');
    const editor = document.getElementById('editor');

    // Editor -> textarea
    editor.addEventListener('policy-changed', (e) => {
      raw.value = JSON.stringify(e.detail.policy, null, 2);
    });
    // Textarea -> editor (only when it holds valid JSON)
    raw.addEventListener('input', () => {
      try { editor.policy = JSON.parse(raw.value); } catch { /* keep typing */ }
    });
    document.getElementById('toggle').addEventListener('click', (e) => {
      editor.hidden = !editor.hidden;
      e.target.textContent = editor.hidden ? 'Show visual editor' : 'Hide visual editor';
    });
    // Layered over the built-in mappings: adds an action, keeps the rest.
    document.getElementById('extra').addEventListener('click', () => {
      editor.mappings = { actions: [{ name: 'dome-op:buy', description: 'Custom action added by the host', parameterCount: 0 }] };
    });
  </script>
</body>
</html>
