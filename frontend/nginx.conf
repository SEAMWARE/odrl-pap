##
# Nginx configuration for the ODRL Policy Editor SPA.
#
# Provides:
# - SPA fallback routing (try_files → /index.html)
# - Gzip compression for text-based assets
# - Long-lived cache headers for hashed static assets
# - Health check endpoint at /healthz
##

server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # -----------------------------------------------------------
    # Gzip compression
    # -----------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # -----------------------------------------------------------
    # Health check endpoint (returns 200 with no body)
    # -----------------------------------------------------------
    location = /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # -----------------------------------------------------------
    # Hashed static assets (JS, CSS, images) — long cache
    # Vite produces filenames like assets/index-abc123.js
    # -----------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # -----------------------------------------------------------
    # SPA fallback — serve index.html for all unmatched routes
    # so client-side routing (React Router) works correctly.
    # -----------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;

        # Prevent caching of index.html itself so users always
        # get the latest version after a deployment.
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }
    }
}
