##
# Nginx configuration for the ODRL Policy Editor SPA.
#
# Provides:
# - Reverse proxy for PAP backend API (avoids CORS issues)
# - SPA fallback routing (try_files → /index.html)
# - Gzip compression for text-based assets
# - Long-lived cache headers for hashed static assets
# - Health check endpoint at /healthz
#
# NOTE: This file is used as a template. At container startup,
# envsubst replaces $PAP_BACKEND_URL with the actual backend URL.
# All other nginx variables ($uri, $host, etc.) are left intact
# because envsubst is invoked with an explicit variable list.
##

server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # -----------------------------------------------------------
    # Gzip compression
    # -----------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # -----------------------------------------------------------
    # Health check endpoint (returns 200 with no body)
    # -----------------------------------------------------------
    location = /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # -----------------------------------------------------------
    # API reverse proxy — forward API requests to the PAP backend.
    # This avoids CORS issues because the browser sees all requests
    # going to the same origin as the frontend.
    # The $PAP_BACKEND_URL placeholder is replaced at container
    # startup via envsubst (e.g., "http://odrl-pap:8080").
    # -----------------------------------------------------------
    location /policy {
        proxy_pass $PAP_BACKEND_URL;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin "";
        proxy_set_header Referer "";
        proxy_http_version 1.1;
    }

    location /service {
        proxy_pass $PAP_BACKEND_URL;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin "";
        proxy_set_header Referer "";
        proxy_http_version 1.1;
    }

    # Use a regex location so that /template and /template/... are
    # proxied, but /templates (the SPA route) falls through to the
    # try_files block and serves index.html instead.
    location ~ ^/template(/|$) {
        proxy_pass $PAP_BACKEND_URL;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin "";
        proxy_set_header Referer "";
        proxy_http_version 1.1;
    }

    location /mappings {
        proxy_pass $PAP_BACKEND_URL;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin "";
        proxy_set_header Referer "";
        proxy_http_version 1.1;
    }

    location /validate {
        proxy_pass $PAP_BACKEND_URL;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin "";
        proxy_set_header Referer "";
        proxy_http_version 1.1;
    }

    # -----------------------------------------------------------
    # Hashed static assets (JS, CSS, images) — long cache
    # Vite produces filenames like assets/index-abc123.js
    # -----------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # -----------------------------------------------------------
    # SPA fallback — serve index.html for all unmatched routes
    # so client-side routing (React Router) works correctly.
    # -----------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;

        # Prevent caching of index.html itself so users always
        # get the latest version after a deployment.
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }
    }
}
