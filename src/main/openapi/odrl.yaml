openapi: 3.0.3
info:
  title: ODRL PAP
  description: ODRL PAP
  version: 1.0.0
tags:
  - name: Service
    description: Set of endpoints to manage policies for a specific service
  - name: Policy
    description: Set of endpoints to manage policies for the main policy
  - name: UI
    description: Set of endpoint intended to support integration with frontends
  - name: Template
    description: Set of endpoints to manage policy templates

paths:
  /service:
    post:
      tags:
        - Service
      operationId: createService
      summary: Create a new service to group policies
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceCreate'
      responses:
        '200':
          description: The policy path
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyPath'
        '409':
          description: Service already exists
    get:
      tags:
        - Service
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      operationId: getServices
      summary: Get all services and the path to their policy
      responses:
        '200':
          description: The services
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceList'
  /service/{service-id}:
    get:
      tags:
        - Service
      parameters:
        - $ref: '#/components/parameters/ServiceId'
      operationId: getService
      summary: Get the service with the given id
      responses:
        '200':
          description: The service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '404':
          description: No such service exists
    delete:
      tags:
        - Service
      parameters:
        - $ref: '#/components/parameters/ServiceId'
      operationId: deleteService
      summary: Delete the service with the given id and all policies below
      responses:
        '204':
          description: Successfully deleted
  /service/{service-id}/policy:
    post:
      tags:
        - Service
      parameters:
        - $ref: '#/components/parameters/ServiceId'
      operationId: createServicePolicy
      summary: Creates a new policy from the given odrl-json under the service-id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OdrlPolicyJson'
      responses:
        '200':
          description: The rego policy
          content:
            text/plain:
              schema:
                type: string
          headers:
            Location:
              schema:
                type: string
              description: location of the created policy
    get:
      tags:
        - Service
      parameters:
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      operationId: getServicePolicies
      summary: Get the policies in the ODRL-Format under the service-id
      responses:
        '200':
          description: Successfully retrieved the policis.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyList'
        '404':
          description: No such policy exists
  /service/{service-id}/policy/{id}:
    put:
      tags:
        - Service
      parameters:
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/Id'
      operationId: createServicePolicyWithId
      summary: Creates or overwrites the given policy under the service-id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OdrlPolicyJson'
      responses:
        '200':
          description: The rego policy
          content:
            text/plain:
              schema:
                type: string
          headers:
            Location:
              schema:
                type: string
              description: location of the created policy
        '409':
          description: Should be returned in case the policy is not allowed to be modified
    get:
      tags:
        - Service
      parameters:
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/Id'
      summary: Return the given policy by its ID under the service-id.
      operationId: getServicePolicyById
      responses:
        '200':
          description: Successfully retrieved the policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        '404':
          description: No such policy exists
    delete:
      tags:
        - Service
      parameters:
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/Id'
      summary:  Delete the given policy under the service-id.
      operationId: deleteServicePolicyById
      responses:
        '204':
          description: Policy was successfully removed.
        '404':
          description: No such policy exists
  /service/{service-id}/policy/odrl/{id}:
    get:
      tags:
        - Service
      parameters:
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/Id'
      summary: Return the given policy by its ID under the service-id.
      operationId: getServicePolicyByUid
      responses:
        '200':
          description: Successfully retrieved the policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        '404':
          description: No such policy exists
    delete:
      tags:
        - Service
      parameters:
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/Id'
      summary:  Delete the given policy under the service-id.
      operationId: deleteServicePolicyByUid
      responses:
        '204':
          description: Policy was successfully removed.
        '404':
          description: No such policy exists

  /policy:
    post:
      tags:
        - Policy
      operationId: createPolicy
      summary: Creates a new policy from the given odrl-json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OdrlPolicyJson'
      responses:
        '200':
          description: The rego policy
          content:
            text/plain:
              schema:
                type: string
          headers:
            Location:
              schema:
                type: string
              description: location of the created policy
    get:
      tags:
        - Policy
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      operationId: getPolicies
      summary: Get the policies in the ODRL-Format
      responses:
        '200':
          description: Successfully retrieved the policis.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyList'
        '404':
          description: No such policy exists
  /policy/{id}:
    put:
      tags:
        - Policy
      parameters:
        - $ref: '#/components/parameters/Id'
      operationId: createPolicyWithId
      summary: Creates or overwrites the given policy.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OdrlPolicyJson'
      responses:
        '200':
          description: The rego policy
          content:
            text/plain:
              schema:
                type: string
          headers:
            Location:
              schema:
                type: string
              description: location of the created policy
        '409':
          description: Should be returned in case the policy is not allowed to be modified
    get:
      tags:
        - Policy
      parameters:
        - $ref: '#/components/parameters/Id'
      summary: Return the given policy by its ID.
      operationId: getPolicyById
      responses:
        '200':
          description: Successfully retrieved the policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        '404':
          description: No such policy exists
    delete:
      tags:
        - Policy
      parameters:
        - $ref: '#/components/parameters/Id'
      summary:  Delete the given policy.
      operationId: deletePolicyById
      responses:
        '204':
          description: Policy was successfully removed.
        '404':
          description: No such policy exists
  /policy/odrl/{id}:
    get:
      tags:
        - Policy
      parameters:
        - $ref: '#/components/parameters/Id'
      summary: Return the given policy by its ID.
      operationId: getPolicyByUid
      responses:
        '200':
          description: Successfully retrieved the policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        '404':
          description: No such policy exists
    delete:
      tags:
        - Policy
      parameters:
        - $ref: '#/components/parameters/Id'
      summary:  Delete the given policy.
      operationId: deletePolicyByUid
      responses:
        '204':
          description: Policy was successfully removed.
        '404':
          description: No such policy exists

  /validate:
    post:
      tags:
        - UI
      operationId: validatePolicy
      summary: Validates a policy against an HTTP test request or an arbitrary JSON payload
      description: >
        Validates a policy by evaluating it against a provided input.
        Two input modes are supported (mutually exclusive):
        (1) HTTP mode — provide a `testRequest` with method, host, path, etc. for
        evaluating policies that target HTTP API gateway requests.
        (2) JSON mode — provide a `jsonInput` with an arbitrary JSON `payload` and
        optional `subject` for evaluating policies against non-HTTP data.
        The policy's own JSON-LD context determines which evaluation path is used.
        Existing requests that only supply `testRequest` continue to work unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidationRequest'
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
  /mappings:
    get:
      tags:
        - UI
      operationId: getMappings
      summary: Gets the supported by the PAP.
      responses:
        '200':
          description: Successfully retrieved the Mappings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mappings'

  /template:
    post:
      tags:
        - Template
      operationId: createTemplate
      summary: Create a new policy template
      description: >
        Creates a new policy template with placeholder definitions. Templates
        contain an ODRL policy skeleton with {{PLACEHOLDER}} tokens that can
        be filled in later to create concrete policies.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateCreate'
      responses:
        '201':
          description: Template created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
    get:
      tags:
        - Template
      operationId: getTemplates
      summary: List all general policy templates
      description: >
        Returns a paginated list of general (non-service-scoped) policy templates.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Successfully retrieved templates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateList'
  /template/{template-id}:
    get:
      tags:
        - Template
      operationId: getTemplateById
      summary: Get a policy template by ID
      parameters:
        - $ref: '#/components/parameters/TemplateId'
      responses:
        '200':
          description: Successfully retrieved the template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
        '404':
          description: No such template exists
    put:
      tags:
        - Template
      operationId: updateTemplate
      summary: Update an existing policy template
      parameters:
        - $ref: '#/components/parameters/TemplateId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateCreate'
      responses:
        '200':
          description: Template updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
        '404':
          description: No such template exists
    delete:
      tags:
        - Template
      operationId: deleteTemplateById
      summary: Delete a policy template by ID
      parameters:
        - $ref: '#/components/parameters/TemplateId'
      responses:
        '204':
          description: Template successfully deleted
        '404':
          description: No such template exists

  /service/{service-id}/template:
    post:
      tags:
        - Service
      operationId: createServiceTemplate
      summary: Create a new policy template under a service
      description: >
        Creates a new policy template scoped to the specified service. The
        template contains an ODRL policy skeleton with {{PLACEHOLDER}} tokens.
      parameters:
        - $ref: '#/components/parameters/ServiceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateCreate'
      responses:
        '201':
          description: Template created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
        '404':
          description: No such service exists
    get:
      tags:
        - Service
      operationId: getServiceTemplates
      summary: List policy templates under a service
      description: >
        Returns a paginated list of policy templates scoped to the specified service.
      parameters:
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Successfully retrieved templates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateList'
        '404':
          description: No such service exists
  /service/{service-id}/template/{template-id}:
    get:
      tags:
        - Service
      operationId: getServiceTemplateById
      summary: Get a service-scoped policy template by ID
      parameters:
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/TemplateId'
      responses:
        '200':
          description: Successfully retrieved the template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
        '404':
          description: No such template or service exists
    put:
      tags:
        - Service
      operationId: updateServiceTemplate
      summary: Update a service-scoped policy template
      parameters:
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/TemplateId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateCreate'
      responses:
        '200':
          description: Template updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
        '404':
          description: No such template or service exists
    delete:
      tags:
        - Service
      operationId: deleteServiceTemplateById
      summary: Delete a service-scoped policy template by ID
      parameters:
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/TemplateId'
      responses:
        '204':
          description: Template successfully deleted
        '404':
          description: No such template or service exists

components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uid'
    ServiceId:
      name: service-id
      in: path
      required: true
      schema:
        type: string
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        default: 0
    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        default: 25
    TemplateId:
      name: template-id
      in: path
      required: true
      schema:
        type: string
      description: The unique identifier of the template
  schemas:
    PolicyPath:
      type: object
      properties:
        policyPath:
          type: string
    Identifier:
      type: string
    ServiceCreate:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
    Service:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
        policyPath:
          type: string
        policies:
          $ref: '#/components/schemas/PolicyList'
    ServiceList:
      type: array
      items:
        type: object
        properties:
          id:
            $ref: '#/components/schemas/Identifier'
          policyPath:
            type: string
    ValidationRequest:
      type: object
      description: >
        Request to validate a policy. Provide either `testRequest` (for HTTP
        request evaluation) or `jsonInput` (for arbitrary JSON payload
        evaluation). The two are mutually exclusive — supply one or the other.
        The policy's JSON-LD context determines which evaluation path is used.
        Optionally, supply `additionalContexts` to override how URIs are
        compacted (e.g., compact `odrl:use` to `mcp:use` instead).
      properties:
        policy:
          $ref: '#/components/schemas/OdrlPolicyJson'
        testRequest:
          $ref: '#/components/schemas/TestRequest'
        jsonInput:
          $ref: '#/components/schemas/GenericJsonInput'
        additionalContexts:
          type: array
          description: >
            Optional list of additional JSON-LD context objects for compaction.
            Each entry is a JSON-LD context object mapping namespace prefixes
            to IRIs (e.g., {"mcp": {"@id": "http://www.w3.org/ns/odrl/2/",
            "@prefix": true}}). These are merged with the default compaction
            context. If an additional context maps a prefix to an IRI that
            already exists in the base context under a different prefix, the
            base prefix is replaced — ensuring that the new prefix is used
            during compaction.
          items:
            type: object
            additionalProperties: true
    TestRequest:
      type: object
      properties:
        method:
          type: string
          enum: ["POST","PATCH","PUT","GET","DELETE"]
        host:
          type: string
        path:
          type: string
        protocol:
          type: string
          enum: ["https"]
        body:
          type: object
        headers:
          $ref: '#/components/schemas/Headers'
    GenericJsonInput:
      type: object
      description: >
        Input for evaluating policies against arbitrary JSON payloads (non-HTTP).
        The `payload` contains the data to evaluate, and the optional `subject`
        carries identity or credential information about the requesting party.
      required:
        - payload
      properties:
        payload:
          type: object
          description: >
            Arbitrary JSON payload to evaluate the policy against. This can
            represent any data structure — e.g., a resource, an event, or a
            document — that the policy's rules will inspect.
          additionalProperties: true
        subject:
          type: object
          description: >
            Optional identity or credential information about the party
            requesting access. Used by assignee and subject-based policy
            constraints (e.g., verifiable credentials, roles, organization).
          additionalProperties: true
    Headers:
      type: object
      properties:
        accept:
          type: string
        authorization:
          type: string
        content-type:
          type: string
    ValidationResponse:
      type: object
      properties:
        allow:
          description: indicates if the request was allowed by the policy
          type: boolean
        explanation:
          description: Explanation of the detailed error, in case the policy evaluation failed.
          type: array
          items:
            type: string
    Mappings:
      type: object
      description: Mappings available to be used for building policies
      properties:
        actions:
          type: array
          items:
            $ref: '#/components/schemas/Mapping'
        operators:
          type: array
          items:
            $ref: '#/components/schemas/Mapping'
        operands:
          type: array
          items:
            $ref: '#/components/schemas/Mapping'
        rightOperands:
          type: array
          items:
            $ref: '#/components/schemas/Mapping'
        leftOperands:
          type: array
          items:
            $ref: '#/components/schemas/Mapping'
        assignees:
          type: array
          items:
            $ref: '#/components/schemas/Mapping'
        targets:
          type: array
          items:
            $ref: '#/components/schemas/Mapping'
        constraints:
          type: array
          items:
            $ref: '#/components/schemas/Mapping'
    Mapping:
      type: object
      description: A concrete mapping.
      properties:
        name:
          type: string
        description:
          type: string
    Policy:
      type: object
      properties:
        id:
          type: string
        "odrl:uid":
          type: string
        odrl:
          type: string
        rego:
          type: string
    PolicyList:
      type: array
      items:
        $ref: '#/components/schemas/Policy'
    Uid:
      type: string
      format: https://datatracker.ietf.org/doc/html/rfc3987
    OdrlPolicyJson:
      type: object
      additionalProperties: true
    TemplatePlaceholder:
      type: object
      description: >
        Defines a placeholder variable within a policy template. Each placeholder
        corresponds to a {{KEY}} token in the ODRL skeleton and natural language text.
      required:
        - key
        - name
        - type
      properties:
        key:
          type: string
          description: >
            The placeholder key matching a {{KEY}} token in the ODRL skeleton
            and natural language text. Must follow the pattern [A-Z_][A-Z0-9_]*.
        name:
          type: string
          description: Display name for the input field shown to the user
        description:
          type: string
          description: Help text shown to the user below the input field
        type:
          type: string
          description: The data type of the placeholder value
          enum:
            - string
            - number
            - boolean
            - "xsd:date"
        options:
          type: array
          description: >
            Optional list of allowed values. If provided, the placeholder is
            rendered as a dropdown select; if absent, a free-form input is shown.
          items:
            type: string
    TemplateCreate:
      type: object
      description: >
        Request body for creating or updating a policy template. Contains the
        ODRL policy skeleton with {{PLACEHOLDER}} tokens, a human-readable
        natural language description, and placeholder definitions.
      required:
        - name
        - odrl
        - placeholders
      properties:
        name:
          type: string
          description: Human-readable name of the template
        description:
          type: string
          description: Human-readable description of what the template does
        odrl:
          $ref: '#/components/schemas/OdrlPolicyJson'
        naturalLanguage:
          type: string
          description: >
            A human-readable sentence using {{PLACEHOLDER}} keys, e.g.
            "Allow read access to {{RESOURCE_ID}} for users in role {{ROLE}}"
        placeholders:
          type: array
          description: List of placeholder definitions used in the ODRL skeleton and natural language text
          items:
            $ref: '#/components/schemas/TemplatePlaceholder'
    Template:
      type: object
      description: A stored policy template with its generated ID
      required:
        - id
        - name
        - odrl
        - placeholders
      properties:
        id:
          type: string
          description: The unique identifier of the template (auto-generated)
        name:
          type: string
          description: Human-readable name of the template
        description:
          type: string
          description: Human-readable description of what the template does
        odrl:
          $ref: '#/components/schemas/OdrlPolicyJson'
        naturalLanguage:
          type: string
          description: >
            A human-readable sentence using {{PLACEHOLDER}} keys, e.g.
            "Allow read access to {{RESOURCE_ID}} for users in role {{ROLE}}"
        placeholders:
          type: array
          description: List of placeholder definitions used in the ODRL skeleton and natural language text
          items:
            $ref: '#/components/schemas/TemplatePlaceholder'
    TemplateList:
      type: array
      description: A list of policy templates
      items:
        $ref: '#/components/schemas/Template'